name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract original website from ZIP
        run: |
          mkdir -p site
          unzip -o Arac-Kutusu-GitHub-Pages.zip -d site
          test -f site/index.html
      - name: Publish built files to repository root
        run: |
          rsync -a site/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html robots.txt favicon.svg assets/
          if ! git diff --cached --quiet; then
            git commit -m "Publish built website files"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload original website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
